<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src  'self' https://cdn.jsdelivr.net;
        style-src   'self' https://fonts.googleapis.com 'unsafe-inline';
        font-src    https://fonts.gstatic.com;
        connect-src 'self' https://qsxwnwxdkgeijewgvone.supabase.co;
        img-src     'self' data:;
    ">
    <title>Device Log — Frequency Monitor</title>
    <meta name="theme-color" content="#00f7ff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .log-page { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

        .log-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .log-back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 8px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.34em;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.18s, border-color 0.18s;
            white-space: nowrap;
            line-height: 1;
        }
        .log-back-btn:hover { color: var(--accent-1); border-color: var(--accent-1); }

        .log-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            font-weight: 700;
            color: var(--accent-1);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 247, 255, 0.4);
            margin: 0;
        }

        .log-subtitle {
            color: var(--muted);
            font-size: 0.85em;
            margin: 0 0 0 auto;
        }

        .log-status {
            color: var(--muted);
            font-size: 0.85em;
            text-align: center;
            padding: 40px;
        }

        .log-table-wrap { overflow-x: auto; }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
        }

        .log-table th {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75em;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-align: left;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .log-table td {
            padding: 13px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .log-table tr:hover td { background: rgba(0,247,255,0.03); }

        .evt-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .evt-boot { background: rgba(147,112,219,0.2); color: #b39ddb; border: 1px solid rgba(147,112,219,0.35); }
        .evt-conn { background: rgba(0,247,255,0.12); color: #00f7ff; border: 1px solid rgba(0,247,255,0.3); }
        .evt-disc { background: rgba(255,160,0,0.12); color: #ffa000; border: 1px solid rgba(255,160,0,0.3); }

        .log-ts { font-family: 'Inter', monospace; color: var(--text); }
        .log-detail { color: var(--muted); }
        .log-detail strong { color: var(--text); }

        .log-refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 7px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.18s, border-color 0.18s;
        }
        .log-refresh-btn:hover { color: var(--accent-1); border-color: var(--accent-1); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a class="log-back-btn" href="index.html">←</a>
        <div class="brand">
            <span class="dot" aria-hidden="true"></span>
            <span>Frequency Monitor</span>
        </div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang="en" class="active" aria-pressed="true">EN</button>
        <button data-lang="ua" aria-pressed="false">UA</button>
    </div>
</header>

<main>
    <div class="log-page">
        <div class="log-header">
            <h1 class="log-title" id="log-title">Device Log</h1>
            <span class="log-subtitle" id="log-subtitle">WiFi &amp; Boot events · esp32_01</span>
            <button class="log-refresh-btn" id="refresh-btn">↻ Refresh</button>
        </div>

        <div id="log-container">
            <div class="log-status" id="log-status">Loading…</div>
        </div>
    </div>
</main>

<footer class="app-footer">
    <div class="footer-content">
        <p><strong>Designed by dgimbialo &copy; 2026</strong></p>
        <p>Power Grid Frequency Monitor &nbsp;·&nbsp;
           Real-time data via <a href="https://supabase.com" target="_blank" rel="noopener">Supabase</a>
        </p>
        <p class="disclaimer" id="footer-disclaimer"></p>
    </div>
</footer>

<script src="assets/js/config.js?v=20260613-04"></script>
<script src="assets/js/device-log.js?v=20260613-04"></script>
</body>
</html>
