<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src  'self' https://cdn.jsdelivr.net;
        style-src   'self' https://fonts.googleapis.com 'unsafe-inline';
        font-src    https://fonts.gstatic.com;
        connect-src 'self' https://qsxwnwxdkgeijewgvone.supabase.co;
        img-src     'self' data:;
    ">
    <title>Device Log — Frequency Monitor</title>
    <meta name="theme-color" content="#00f7ff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .log-page { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }

        .log-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .log-back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--accent-1);
            color: var(--accent-1);
            border-radius: 8px;
            padding: 5px 16px;
            font-size: 1.4em;
            line-height: 1;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.18s, border-color 0.18s, box-shadow 0.18s;
        }
        .log-back-btn:hover {
            box-shadow: 0 0 8px rgba(0, 247, 255, 0.45);
        }
        .back-arrow-symbol {
            display: inline-block;
            transform: scale(1.4);
            position: relative;
            top: -1px;
        }

        .log-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3em;
            font-weight: 700;
            color: var(--accent-1);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 247, 255, 0.4);
            margin: 0;
        }

        .log-subtitle {
            color: var(--muted);
            font-size: 0.85em;
            margin: 0 0 0 auto;
        }

        .log-status {
            color: var(--muted);
            font-size: 0.85em;
            text-align: center;
            padding: 40px;
        }

        .log-table-wrap { overflow-x: auto; }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
        }

        .log-table th {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75em;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-align: left;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .log-table td {
            padding: 13px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .log-table tr:hover td { background: rgba(0,247,255,0.03); }

        .evt-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .evt-boot { background: rgba(147,112,219,0.2); color: #b39ddb; border: 1px solid rgba(147,112,219,0.35); }
        .evt-conn { background: rgba(0,247,255,0.12); color: #00f7ff; border: 1px solid rgba(0,247,255,0.3); }
        .evt-disc { background: rgba(255,160,0,0.12); color: #ffa000; border: 1px solid rgba(255,160,0,0.3); }

        .log-ts { font-family: 'Inter', monospace; color: var(--text); }
        .log-detail { color: var(--muted); }
        .log-detail strong { color: var(--text); }

        .log-refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 7px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.18s, border-color 0.18s;
        }
        .log-refresh-btn:hover { color: var(--accent-1); border-color: var(--accent-1); }

        .evt-crash { background: rgba(255,43,214,0.14); color: #ff6be3; border: 1px solid rgba(255,43,214,0.4); }

        /* ── Status card ─────────────────────────────────────────────── */
        .dl-status {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 24px;
        }
        .dl-status-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        .dl-status-title {
            font-family: 'Orbitron', sans-serif; font-size: 0.8em; letter-spacing: 1.5px; color: var(--accent-1);
        }
        .dl-status-empty { color: var(--muted); font-size: 0.85em; }
        .dl-status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px 18px;
        }
        .dl-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .dl-cell .dl-k { color: var(--muted); font-size: 0.75em; }
        .dl-cell .dl-v { font-size: 0.9em; overflow-wrap: anywhere; }
        .dl-pill { padding: 2px 10px; border-radius: 999px; font-size: 0.75em; font-weight: 600; }
        .dl-pill-on  { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid rgba(0,230,118,0.4); }
        .dl-pill-off { background: rgba(255,82,82,0.15); color: #ff5252; border: 1px solid rgba(255,82,82,0.4); }
        .dl-dim { color: var(--muted); font-size: 0.85em; }
        .dl-ok  { color: #00e676; }
        .dl-bad { color: #ff5252; font-weight: 600; }
        code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 0.92em; }

        /* ── Table rows ──────────────────────────────────────────────── */
        .log-hint { color: var(--muted); font-size: 0.78em; margin: -18px 0 14px; }
        .dl-row { cursor: pointer; user-select: none; }
        .dl-row:focus-visible td { outline: none; background: rgba(0,247,255,0.08); }
        .dl-row-crash .log-ts { color: #ff8be8; }
        .dl-report-tag {
            margin-left: 8px; padding: 1px 8px; border-radius: 6px; font-size: 0.85em;
            background: rgba(255,43,214,0.12); color: #ff8be8; border: 1px solid rgba(255,43,214,0.35);
            white-space: nowrap;
        }

        /* ── Details dialog ──────────────────────────────────────────── */
        .dl-dlg {
            width: min(680px, calc(100vw - 32px));
            max-height: 86vh;
            max-height: 86dvh;             /* mobile: excludes the browser's URL bar */
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: linear-gradient(180deg, #1b0a3a, #0c0420);
            color: var(--text);
            box-shadow: var(--shadow);
            overflow: hidden;              /* only .dl-dlg-body scrolls: one scrollbar */
        }
        .dl-dlg[open] { display: flex; flex-direction: column; }
        html:has(.dl-dlg[open]) { overflow: hidden; }   /* page behind the dialog does not scroll */
        .dl-dlg::backdrop { background: rgba(5, 2, 15, 0.7); backdrop-filter: blur(2px); }
        .dl-dlg-head {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; border-bottom: 1px solid var(--border);
            background: #1b0a3a; flex-shrink: 0;
        }
        .dl-dlg-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.95em; }
        .dl-dlg-close {
            margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--muted);
            border-radius: 8px; width: 32px; height: 32px; font-size: 1.1em; cursor: pointer; flex-shrink: 0;
        }
        .dl-dlg-close:hover { color: var(--accent-1); border-color: var(--accent-1); }
        .dl-dlg-body {
            /* flex-basis auto (not 0%): with the dialog height only capped by
               max-height, some mobile browsers resolved a 0% basis to 0 and the
               body collapsed, leaving just the header visible */
            padding: 6px 18px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 0;
        }
        /* Neon scrollbar. Firefox only understands the standard properties;
           Chrome/Edge/Safari get the fully styled WebKit version below (in Chrome
           the standard properties would override it and bring back arrows). */
        @supports not selector(::-webkit-scrollbar) {
            .dl-dlg-body { scrollbar-width: thin; scrollbar-color: rgba(0, 247, 255, 0.5) transparent; }
        }
        .dl-dlg-body::-webkit-scrollbar        { width: 8px; }
        .dl-dlg-body::-webkit-scrollbar-track  { background: transparent; }
        .dl-dlg-body::-webkit-scrollbar-button { display: none; }
        .dl-dlg-body::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(0, 247, 255, 0.55), rgba(255, 43, 214, 0.45));
            border-radius: 8px;
            box-shadow: 0 0 6px rgba(0, 247, 255, 0.5);
        }
        .dl-dlg-body::-webkit-scrollbar-thumb:hover { background: rgba(0, 247, 255, 0.75); }
        .dl-dlg-body section { margin-top: 14px; }
        .dl-dlg-body h3 {
            font-family: 'Orbitron', sans-serif; font-size: 0.72em; letter-spacing: 1.5px;
            color: var(--accent-1); margin: 0 0 8px; font-weight: 500;
        }
        .dl-kv {
            display: grid; grid-template-columns: 210px 1fr; gap: 12px;
            padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.88em;
        }
        .dl-kv .dl-k { color: var(--muted); }
        .dl-kv .dl-v { overflow-wrap: anywhere; }
        .dl-bt { display: block; line-height: 1.6; }
        .dl-cmd {
            display: flex; gap: 10px; align-items: flex-start;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 10px; font-size: 0.8em;
        }
        .dl-cmd code { flex: 1; overflow-wrap: anywhere; }
        .dl-copy {
            background: transparent; border: 1px solid var(--border); color: var(--accent-1);
            border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.95em; flex-shrink: 0;
        }
        .dl-nbs { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .dl-nb {
            display: flex; align-items: center; gap: 12px; text-align: left;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            color: var(--text); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: 0.85em;
        }
        .dl-nb:hover:not(:disabled) { border-color: var(--border); }
        .dl-nb-self { border-color: var(--border); background: rgba(0,247,255,0.06); cursor: default; }
        .dl-nb-time { font-family: 'Inter', monospace; }

        @media (max-width: 560px) {
            .log-page { padding: 20px 16px 48px; }
            .log-header { flex-wrap: wrap; gap: 12px; }
            .log-subtitle { margin: 0; width: 100%; order: 3; }
            .dl-kv { grid-template-columns: 1fr; gap: 2px; }
            /* Explicit height on phones: the body then always gets the space
               left under the header, whatever the browser's flex quirks */
            .dl-dlg { height: 86vh; height: 86dvh; }
            .dl-status-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a class="log-back-btn" href="index.html"><span class="back-arrow-symbol">⇦</span></a>
        <div class="brand">
            <span class="dot" aria-hidden="true"></span>
            <span id="brand-text">Frequency Monitor</span>
        </div>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang="en" class="active" aria-pressed="true">EN</button>
        <button data-lang="ua" aria-pressed="false">UA</button>
    </div>
</header>

<main>
    <div class="log-page">
        <div class="log-header">
            <h1 class="log-title" id="log-title">Device Log</h1>
            <span class="log-subtitle" id="log-subtitle">WiFi &amp; Boot events · esp32_01</span>
            <button class="log-refresh-btn" id="refresh-btn">↻ Refresh</button>
        </div>

        <div class="dl-status" id="status-card"></div>
        <p class="log-hint" id="log-hint">Click an event for details</p>

        <div id="log-container">
            <div class="log-status" id="log-status">Loading…</div>
        </div>
    </div>
</main>

<dialog class="dl-dlg" id="evt-dialog" aria-labelledby="evt-dialog-title">
    <div class="dl-dlg-head">
        <div class="dl-dlg-title" id="evt-dialog-title"></div>
        <button type="button" class="dl-dlg-close" aria-label="Close">✕</button>
    </div>
    <div class="dl-dlg-body"></div>
</dialog>

<footer class="app-footer">
    <div class="footer-content">
        <p><strong>Designed by dgimbialo &copy; 2026</strong></p>
        <p>Power Grid Frequency Monitor &nbsp;·&nbsp;
           Real-time data via <a href="https://supabase.com" target="_blank" rel="noopener">Supabase</a>
        </p>
        <p class="disclaimer" id="footer-disclaimer"></p>
    </div>
</footer>

<script src="assets/js/config.js?v=20261002-03"></script>
<script src="assets/js/device-log.js?v=20261002-03"></script>
</body>
</html>
